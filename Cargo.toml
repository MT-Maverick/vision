[package]
name = "vision-snapshot"
version = "3.0.0"
edition = "2021"

[[bin]]
name = "vision-snapshot"
path = "src/main.rs"

[[bin]]
name = "vision-healthcheck"
path = "src/bin/healthcheck.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.5", default-features = false, features = ["fs", "set-header"] }
