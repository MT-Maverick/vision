<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1118">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vision Snapshot</title>
<link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
<div class="app" id="stage">
  <video id="video" autoplay playsinline muted></video>
  <img id="still" alt="Photo you took" hidden>
  <div class="shade top"></div><div class="shade bottom"></div>
  <div class="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <div class="empty" id="empty" hidden>
    <p id="emptyMsg"></p>
    <button class="chip" id="retry">Try camera again</button>
  </div>

  <header class="top">
    <h1>Vision Snapshot</h1>
    <span class="conn"><span class="dot" id="dot"></span><span id="conn">Connecting</span></span>
    <button class="chip" id="loc" aria-pressed="false">Location off</button>
    <button class="chip" id="optsBtn" aria-expanded="false" aria-controls="opts">Options</button>
  </header>

  <div class="pill glass" id="pill" role="status" hidden></div>

  <section class="opts glass" id="opts" hidden aria-label="Options">
    <div class="seg wrap" role="group" aria-label="Answer style">
      <button data-group="mode" data-value="identify" aria-pressed="true">Name it</button>
      <button data-group="mode" data-value="describe" aria-pressed="false">Describe it</button>
      <button data-group="mode" data-value="narrate" aria-pressed="false">Narrator</button>
      <button data-group="mode" data-value="story" aria-pressed="false">Mini story</button>
      <button data-group="mode" data-value="funny" aria-pressed="false">Joke</button>
      <button data-group="mode" data-value="funfact" aria-pressed="false">Fun fact</button>
    </div>
    <p class="label">Assistant skills</p>
    <div class="seg wrap skills" role="group" aria-label="Assistant skills">
      <button data-skill="explain" aria-pressed="true">Explain the identified object</button>
      <button data-skill="ocr" aria-pressed="true">Read visible text (OCR)</button>
      <button data-skill="translate" aria-pressed="true">Translate text to English</button>
      <button data-skill="web_search" aria-pressed="false">Find image matches with Google Lens</button>
    </div>
    <p class="foot">Image search sends the photo to SerpApi for Google Lens matching. Search is off until enabled.</p>
    <button class="chip" id="speak" aria-pressed="false">Read answers aloud</button>
    <div class="seg" role="group" aria-label="Frames">
      <button data-group="frames" data-value="1" aria-pressed="true">One frame</button>
      <button data-group="frames" data-value="4" aria-pressed="false">Burst of 4</button>
    </div>
    <p class="label">Watch mode reacts to</p>
    <div class="seg" role="group" aria-label="Watch for">
      <button id="tPerson" aria-pressed="true">People</button>
      <button id="tLandmark" aria-pressed="true">Landmarks</button>
    </div>
    <label class="field">Where are you? (optional, overrides GPS)
      <input id="place" type="text" maxlength="80" placeholder="e.g. Bronkhorstspruit" autocomplete="off">
    </label>
    <label class="chip pick">Take or choose a photo
      <input type="file" id="file" accept="image/*" capture="environment" hidden>
    </label>
    <p class="foot" id="model"></p>
  </section>

  <footer class="dock">
    <ol class="history" id="history" aria-label="Recent results" hidden></ol>
    <div class="readout glass" aria-live="polite">
      <p class="result idle" id="result">Point at something and press the shutter, or ask a question below.</p>
      <p class="meta" id="meta"></p>
      <div class="sources" id="sources" hidden aria-label="Web sources"></div>
      <button class="chip small" id="card" hidden>Save as card</button>
      <div class="ask">
        <input id="ask" type="text" maxlength="300" placeholder="Ask about this view…" enterkeyhint="send" autocomplete="off" aria-label="Ask a question about the view">
        <button class="chip small" id="askBtn">Ask</button>
      </div>
      <button class="chip small" id="useLast" aria-pressed="false" hidden>Ask about the last photo instead</button>
    </div>
    <div class="controls">
      <button class="chip round" id="flip" aria-label="Switch camera">Flip</button>
      <button class="shutter" id="shutter" aria-label="Analyze this view"><span></span></button>
      <button class="chip round" id="watch" aria-pressed="false" aria-label="Watch for people and landmarks">Watch</button>
    </div>
  </footer>
</div>
<script src="/static/script.js?v=3"></script>
</body>
</html>
