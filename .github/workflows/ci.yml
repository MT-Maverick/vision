name: Rust CI

on:
  push:
    branches: [rust-variant]
  pull_request:
    branches: [rust-variant]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build and test
        run: cargo test --locked --all-targets
